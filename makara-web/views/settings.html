<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <style id="theme-vars">
/* Makara WPF UI — Design Tokens */

:root {
  /* Primary hue: cyan */
  --mk-primary-50: #e6fbff;
  --mk-primary-100: #b3f4ff;
  --mk-primary-200: #80ecff;
  --mk-primary-300: #4de3ff;
  --mk-primary-400: #1adbff;
  --mk-primary-500: #00d9ff;
  --mk-primary-600: #00a8c6;
  --mk-primary-700: #007d94;
  --mk-primary-800: #005261;
  --mk-primary-900: #00272e;

  /* Neutral / slate */
  --mk-neutral-0: #ffffff;
  --mk-neutral-50: #f8fafc;
  --mk-neutral-100: #f1f5f9;
  --mk-neutral-200: #e2e8f0;
  --mk-neutral-300: #cbd5e1;
  --mk-neutral-400: #94a3b8;
  --mk-neutral-500: #64748b;
  --mk-neutral-600: #475569;
  --mk-neutral-700: #334155;
  --mk-neutral-800: #1e293b;
  --mk-neutral-900: #0f172a;
  --mk-neutral-950: #020617;

  /* Semantic tokens — dark default */
  --mk-background: #0b0f17;
  --mk-foreground: #f0f4f8;
  --mk-card: #111827;
  --mk-card-foreground: #f0f4f8;
  --mk-popover: #151d2c;
  --mk-popover-foreground: #f0f4f8;
  --mk-primary: #00d9ff;
  --mk-primary-foreground: #0b0f17;
  --mk-secondary: #1e293b;
  --mk-secondary-foreground: #f0f4f8;
  --mk-muted: #151d2c;
  --mk-muted-foreground: #94a3b8;
  --mk-accent: #1e293b;
  --mk-accent-foreground: #f0f4f8;
  --mk-destructive: #ef4444;
  --mk-destructive-foreground: #ffffff;
  --mk-border: #1e293b;
  --mk-input: #1e293b;
  --mk-ring: rgba(0, 217, 255, 0.35);

  /* Surface stack */
  --mk-surface: #111827;
  --mk-surface-2: #1a2538;
  --mk-surface-3: #243247;

  /* Text */
  --mk-text-primary: #f0f4f8;
  --mk-text-secondary: #94a3b8;
  --mk-text-tertiary: #64748b;

  /* Status */
  --mk-state-success: #10b981;
  --mk-state-warning: #f59e0b;
  --mk-state-error: #ef4444;
  --mk-state-info: #3b82f6;

  /* Radius */
  --mk-radius-sm: 4px;
  --mk-radius-md: 8px;
  --mk-radius-lg: 12px;
  --mk-radius-full: 9999px;

  /* Typography */
  --mk-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --mk-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;

  /* Shadow */
  --mk-shadow-1: 0 1px 2px rgba(2, 6, 23, 0.35), 0 1px 1px rgba(2, 6, 23, 0.25);
  --mk-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --mk-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.60);
}

.light,
html.light {
  --mk-background: #f8fafc;
  --mk-foreground: #0f172a;
  --mk-card: #ffffff;
  --mk-card-foreground: #0f172a;
  --mk-popover: #ffffff;
  --mk-popover-foreground: #0f172a;
  --mk-primary: #00a8c6;
  --mk-primary-foreground: #ffffff;
  --mk-secondary: #f1f5f9;
  --mk-secondary-foreground: #0f172a;
  --mk-muted: #f1f5f9;
  --mk-muted-foreground: #64748b;
  --mk-accent: #f1f5f9;
  --mk-accent-foreground: #0f172a;
  --mk-destructive: #ef4444;
  --mk-destructive-foreground: #ffffff;
  --mk-border: #e2e8f0;
  --mk-input: #e2e8f0;
  --mk-ring: rgba(0, 168, 198, 0.35);

  --mk-surface: #ffffff;
  --mk-surface-2: #f1f5f9;
  --mk-surface-3: #e2e8f0;

  --mk-text-primary: #0f172a;
  --mk-text-secondary: #475569;
  --mk-text-tertiary: #64748b;

  --mk-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 1px rgba(15, 23, 42, 0.04);
  --mk-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --mk-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.20);
}

@theme inline {
  --color-background: var(--mk-background);
  --color-foreground: var(--mk-foreground);
  --color-card: var(--mk-card);
  --color-card-foreground: var(--mk-card-foreground);
  --color-popover: var(--mk-popover);
  --color-popover-foreground: var(--mk-popover-foreground);
  --color-primary: var(--mk-primary);
  --color-primary-foreground: var(--mk-primary-foreground);
  --color-secondary: var(--mk-secondary);
  --color-secondary-foreground: var(--mk-secondary-foreground);
  --color-muted: var(--mk-muted);
  --color-muted-foreground: var(--mk-muted-foreground);
  --color-accent: var(--mk-accent);
  --color-accent-foreground: var(--mk-accent-foreground);
  --color-destructive: var(--mk-destructive);
  --color-destructive-foreground: var(--mk-destructive-foreground);
  --color-border: var(--mk-border);
  --color-input: var(--mk-input);
  --color-ring: var(--mk-ring);

  --radius-sm: var(--mk-radius-sm);
  --radius-md: var(--mk-radius-md);
  --radius-lg: var(--mk-radius-lg);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- Shared app shell for Makara WPF client -->
      <div class="mk-shell">
        <aside class="mk-shell__sidebar">
          <div class="flex items-center gap-3 px-4" style="height: 56px;">
            <img src="../assets/logo-white.png" alt="Makara" style="height: 32px;">
          </div>

          <div class="px-4 py-2 text-xs" style="color: var(--mk-text-secondary);">
            v0.1.0 · MVP
          </div>

          <nav class="mk-shell__nav">
            <a href="#" class="mk-shell__nav-item" data-dom-id="nav-dashboard" data-nav-key="dashboard">
              <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
              <span>仪表盘</span>
            </a>
            <a href="#" class="mk-shell__nav-item" data-dom-id="nav-workflows" data-nav-key="workflows">
              <i data-lucide="git-branch" class="w-5 h-5"></i>
              <span>工作流</span>
            </a>
            <a href="#" class="mk-shell__nav-item" data-dom-id="nav-data-sources" data-nav-key="data-sources">
              <i data-lucide="database" class="w-5 h-5"></i>
              <span>数据源</span>
            </a>
            <a href="#" class="mk-shell__nav-item" data-dom-id="nav-datasets" data-nav-key="datasets">
              <i data-lucide="table" class="w-5 h-5"></i>
              <span>数据集</span>
            </a>
            <a href="#" class="mk-shell__nav-item" data-dom-id="nav-runs" data-nav-key="runs">
              <i data-lucide="activity" class="w-5 h-5"></i>
              <span>执行记录</span>
            </a>
            <a href="#" class="mk-shell__nav-item" data-dom-id="nav-servers" data-nav-key="servers">
              <i data-lucide="server" class="w-5 h-5"></i>
              <span>服务端</span>
            </a>
            <a href="#" class="mk-shell__nav-item" data-dom-id="nav-settings" data-nav-key="settings" data-active="true">
              <i data-lucide="settings" class="w-5 h-5"></i>
              <span>设置</span>
            </a>
          </nav>
        </aside>

        <header class="mk-shell__header">
          <div class="flex items-center justify-between h-full px-6">
            <div class="text-lg font-medium" style="color: var(--mk-text-primary);">
              设置
            </div>

            <div class="flex items-center gap-3">
              <input
                type="search"
                placeholder="搜索..."
                class="px-3 py-1.5 text-sm rounded-md outline-none"
                style="background-color: var(--mk-input); color: var(--mk-text-primary); border: 1px solid var(--mk-border); width: 200px;"
              />

              <select
                class="px-3 py-1.5 text-sm rounded-md outline-none"
                style="background-color: var(--mk-input); color: var(--mk-text-primary); border: 1px solid var(--mk-border);"
              >
                <option>本地服务器</option>
                <option>开发服务器</option>
                <option>生产服务器</option>
              </select>

              <button
                class="flex items-center justify-center w-9 h-9 rounded-md"
                style="background-color: var(--mk-input); color: var(--mk-text-primary); border: 1px solid var(--mk-border);"
                aria-label="切换主题"
              >
                <i data-lucide="sun" class="w-5 h-5"></i>
              </button>

              <button
                class="flex items-center justify-center w-9 h-9 rounded-md"
                style="background-color: var(--mk-input); color: var(--mk-text-primary); border: 1px solid var(--mk-border);"
                aria-label="用户菜单"
              >
                <i data-lucide="user" class="w-5 h-5"></i>
              </button>
            </div>
          </div>
        </header>

        <main class="mk-shell__main">
          <div style="max-width: 960px;">
            <!-- Page header -->
            <div class="flex items-center justify-between mb-6">
              <h1 class="text-2xl font-semibold" style="color: var(--mk-text-primary);">设置</h1>
              <div class="flex items-center gap-3">
                <button class="mk-btn mk-btn--secondary" data-dom-id="btn-reset-settings">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  恢复默认
                </button>
                <button class="mk-btn mk-btn--primary" data-dom-id="btn-save-settings">
                  <i data-lucide="save" class="w-4 h-4"></i>
                  保存设置
                </button>
              </div>
            </div>

            <!-- Appearance -->
            <section class="mk-settings-card mb-6">
              <div class="mk-settings-card__title">外观</div>
              <div class="mk-settings-row">
                <div>
                  <div class="mk-settings-row__label">主题模式</div>
                  <div class="mk-settings-row__hint">选择深色或浅色界面主题</div>
                </div>
                <div class="mk-option-group" role="group" aria-label="主题模式">
                  <button class="mk-option" data-dom-id="theme-dark" data-selected="false" type="button">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                    深色
                  </button>
                  <button class="mk-option" data-dom-id="theme-light" data-selected="true" type="button">
                    <i data-lucide="sun" class="w-4 h-4"></i>
                    浅色
                  </button>
                </div>
              </div>
              <div class="mk-settings-row">
                <div>
                  <div class="mk-settings-row__label">界面缩放</div>
                  <div class="mk-settings-row__hint">调整界面元素显示大小</div>
                </div>
                <div class="mk-option-group" role="group" aria-label="界面缩放">
                  <button class="mk-option" data-dom-id="scale-small" data-selected="false" type="button">小</button>
                  <button class="mk-option" data-dom-id="scale-medium" data-selected="true" type="button">中</button>
                  <button class="mk-option" data-dom-id="scale-large" data-selected="false" type="button">大</button>
                </div>
              </div>
            </section>

            <!-- Default parameters -->
            <section class="mk-settings-card mb-6">
              <div class="mk-settings-card__title">默认参数</div>
              <div class="mk-settings-row">
                <label for="default-epochs" class="mk-settings-row__label">默认训练轮数</label>
                <input id="default-epochs" type="number" class="mk-input" value="10" min="1" data-dom-id="input-default-epochs" />
              </div>
              <div class="mk-settings-row">
                <label for="default-lr" class="mk-settings-row__label">默认学习率</label>
                <input id="default-lr" type="number" step="0.0001" class="mk-input" value="0.001" data-dom-id="input-default-lr" />
              </div>
              <div class="mk-settings-row">
                <label for="default-val-split" class="mk-settings-row__label">默认验证集比例</label>
                <input id="default-val-split" type="number" step="0.01" min="0" max="1" class="mk-input" value="0.2" data-dom-id="input-default-val-split" />
              </div>
              <div class="mk-settings-row">
                <label for="default-batch-size" class="mk-settings-row__label">默认批次大小</label>
                <input id="default-batch-size" type="number" class="mk-input" value="32" min="1" data-dom-id="input-default-batch-size" />
              </div>
            </section>

            <!-- Data security -->
            <section class="mk-settings-card mb-6">
              <div class="mk-settings-card__title">数据安全</div>
              <div class="mk-settings-row">
                <div>
                  <div class="mk-settings-row__label">启用字段加密</div>
                  <div class="mk-settings-row__hint">对敏感字段进行端到端加密存储</div>
                </div>
                <input type="checkbox" class="mk-toggle" data-dom-id="toggle-field-encryption" checked />
              </div>
              <div class="mk-settings-row">
                <div>
                  <div class="mk-settings-row__label">启用数据脱敏</div>
                  <div class="mk-settings-row__hint">预览与日志中自动脱敏显示敏感信息</div>
                </div>
                <input type="checkbox" class="mk-toggle" data-dom-id="toggle-data-masking" checked />
              </div>
              <div class="mk-settings-row">
                <label for="sensitive-regex" class="mk-settings-row__label">敏感字段正则</label>
                <input id="sensitive-regex" type="text" class="mk-input" value="(?i)(password|secret|token|key|ssn|phone|email|id_card)" data-dom-id="input-sensitive-regex" />
              </div>
            </section>

            <!-- Notifications -->
            <section class="mk-settings-card mb-6">
              <div class="mk-settings-card__title">通知</div>
              <div class="mk-settings-row">
                <div>
                  <div class="mk-settings-row__label">SSE 推送</div>
                  <div class="mk-settings-row__hint">通过服务端推送接收实时任务状态</div>
                </div>
                <input type="checkbox" class="mk-toggle" data-dom-id="toggle-sse-push" checked />
              </div>
              <div class="mk-settings-row">
                <div>
                  <div class="mk-settings-row__label">任务完成提醒</div>
                  <div class="mk-settings-row__hint">工作流或训练任务结束时弹出通知</div>
                </div>
                <input type="checkbox" class="mk-toggle" data-dom-id="toggle-task-reminder" checked />
              </div>
              <div class="mk-settings-row">
                <label for="notify-email" class="mk-settings-row__label">邮件通知地址</label>
                <input id="notify-email" type="email" class="mk-input" placeholder="notify@example.com" data-dom-id="input-notify-email" />
              </div>
            </section>

            <!-- About -->
            <section class="mk-settings-card">
              <div class="mk-settings-card__title">关于</div>
              <div class="mk-settings-row">
                <div class="mk-settings-row__label">版本号</div>
