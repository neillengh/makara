<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务端管理</title>
    <style id="theme-vars">
/* Makara WPF UI — Design Tokens */

:root {
  /* Primary hue: cyan */
  --mk-primary-50: #e6fbff;
  --mk-primary-100: #b3f4ff;
  --mk-primary-200: #80ecff;
  --mk-primary-300: #4de3ff;
  --mk-primary-400: #1adbff;
  --mk-primary-500: #00d9ff;
  --mk-primary-600: #00a8c6;
  --mk-primary-700: #007d94;
  --mk-primary-800: #005261;
  --mk-primary-900: #00272e;

  /* Neutral / slate */
  --mk-neutral-0: #ffffff;
  --mk-neutral-50: #f8fafc;
  --mk-neutral-100: #f1f5f9;
  --mk-neutral-200: #e2e8f0;
  --mk-neutral-300: #cbd5e1;
  --mk-neutral-400: #94a3b8;
  --mk-neutral-500: #64748b;
  --mk-neutral-600: #475569;
  --mk-neutral-700: #334155;
  --mk-neutral-800: #1e293b;
  --mk-neutral-900: #0f172a;
  --mk-neutral-950: #020617;

  /* Semantic tokens — dark default */
  --mk-background: #0b0f17;
  --mk-foreground: #f0f4f8;
  --mk-card: #111827;
  --mk-card-foreground: #f0f4f8;
  --mk-popover: #151d2c;
  --mk-popover-foreground: #f0f4f8;
  --mk-primary: #00d9ff;
  --mk-primary-foreground: #0b0f17;
  --mk-secondary: #1e293b;
  --mk-secondary-foreground: #f0f4f8;
  --mk-muted: #151d2c;
  --mk-muted-foreground: #94a3b8;
  --mk-accent: #1e293b;
  --mk-accent-foreground: #f0f4f8;
  --mk-destructive: #ef4444;
  --mk-destructive-foreground: #ffffff;
  --mk-border: #1e293b;
  --mk-input: #1e293b;
  --mk-ring: rgba(0, 217, 255, 0.35);

  /* Surface stack */
  --mk-surface: #111827;
  --mk-surface-2: #1a2538;
  --mk-surface-3: #243247;

  /* Text */
  --mk-text-primary: #f0f4f8;
  --mk-text-secondary: #94a3b8;
  --mk-text-tertiary: #64748b;

  /* Status */
  --mk-state-success: #10b981;
  --mk-state-warning: #f59e0b;
  --mk-state-error: #ef4444;
  --mk-state-info: #3b82f6;

  /* Radius */
  --mk-radius-sm: 4px;
  --mk-radius-md: 8px;
  --mk-radius-lg: 12px;
  --mk-radius-full: 9999px;

  /* Typography */
  --mk-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --mk-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;

  /* Shadow */
  --mk-shadow-1: 0 1px 2px rgba(2, 6, 23, 0.35), 0 1px 1px rgba(2, 6, 23, 0.25);
  --mk-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --mk-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.60);
}

.light,
html.light {
  --mk-background: #f8fafc;
  --mk-foreground: #0f172a;
  --mk-card: #ffffff;
  --mk-card-foreground: #0f172a;
  --mk-popover: #ffffff;
  --mk-popover-foreground: #0f172a;
  --mk-primary: #00a8c6;
  --mk-primary-foreground: #ffffff;
  --mk-secondary: #f1f5f9;
  --mk-secondary-foreground: #0f172a;
  --mk-muted: #f1f5f9;
  --mk-muted-foreground: #64748b;
  --mk-accent: #f1f5f9;
  --mk-accent-foreground: #0f172a;
  --mk-destructive: #ef4444;
  --mk-destructive-foreground: #ffffff;
  --mk-border: #e2e8f0;
  --mk-input: #e2e8f0;
  --mk-ring: rgba(0, 168, 198, 0.35);

  --mk-surface: #ffffff;
  --mk-surface-2: #f1f5f9;
  --mk-surface-3: #e2e8f0;

  --mk-text-primary: #0f172a;
  --mk-text-secondary: #475569;
  --mk-text-tertiary: #64748b;

  --mk-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 1px rgba(15, 23, 42, 0.04);
  --mk-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --mk-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.20);
}

@theme inline {
  --color-background: var(--mk-background);
  --color-foreground: var(--mk-foreground);
  --color-card: var(--mk-card);
  --color-card-foreground: var(--mk-card-foreground);
  --color-popover: var(--mk-popover);
  --color-popover-foreground: var(--mk-popover-foreground);
  --color-primary: var(--mk-primary);
  --color-primary-foreground: var(--mk-primary-foreground);
  --color-secondary: var(--mk-secondary);
  --color-secondary-foreground: var(--mk-secondary-foreground);
  --color-muted: var(--mk-muted);
  --color-muted-foreground: var(--mk-muted-foreground);
  --color-accent: var(--mk-accent);
  --color-accent-foreground: var(--mk-accent-foreground);
  --color-destructive: var(--mk-destructive);
  --color-destructive-foreground: var(--mk-destructive-foreground);
  --color-border: var(--mk-border);
  --color-input: var(--mk-input);
  --color-ring: var(--mk-ring);

  --radius-sm: var(--mk-radius-sm);
  --radius-md: var(--mk-radius-md);
  --radius-lg: var(--mk-radius-lg);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

<body class="min-h-screen font-sans antialiased">
  <div class="mk-shell">
    <aside class="mk-shell__sidebar">
      <div class="flex items-center gap-3 px-4" style="height: 56px;">
        <img src="../assets/logo-white.png" alt="Makara" style="height: 32px;">
      </div>

      <div class="px-4 py-2 text-xs" style="color: var(--mk-text-secondary);">
        v0.1.0 · MVP
      </div>

      <nav class="mk-shell__nav">
        <a href="dashboard.html" class="mk-shell__nav-item" data-dom-id="nav-dashboard" data-nav-key="dashboard">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span>仪表盘</span>
        </a>
        <a href="workflows.html" class="mk-shell__nav-item" data-dom-id="nav-workflows" data-nav-key="workflows">
          <i data-lucide="git-branch" class="w-5 h-5"></i>
          <span>工作流</span>
        </a>
        <a href="#" class="mk-shell__nav-item" data-dom-id="nav-data-sources" data-nav-key="data-sources">
          <i data-lucide="database" class="w-5 h-5"></i>
          <span>数据源</span>
        </a>
        <a href="#" class="mk-shell__nav-item" data-dom-id="nav-datasets" data-nav-key="datasets">
          <i data-lucide="table" class="w-5 h-5"></i>
          <span>数据集</span>
        </a>
        <a href="#" class="mk-shell__nav-item" data-dom-id="nav-runs" data-nav-key="runs">
          <i data-lucide="activity" class="w-5 h-5"></i>
          <span>执行记录</span>
        </a>
        <a href="servers.html" class="mk-shell__nav-item" data-dom-id="nav-servers" data-nav-key="servers" data-active="true">
          <i data-lucide="server" class="w-5 h-5"></i>
          <span>服务端</span>
        </a>
        <a href="#" class="mk-shell__nav-item" data-dom-id="nav-settings" data-nav-key="settings">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span>设置</span>
        </a>
      </nav>
    </aside>

    <header class="mk-shell__header">
      <div class="flex items-center justify-between h-full px-6">
        <div class="text-lg font-medium" style="color: var(--mk-text-primary);">
          服务端
        </div>

        <div class="flex items-center gap-3">
          <input
            type="search"
            placeholder="搜索..."
            class="px-3 py-1.5 text-sm rounded-md outline-none"
            style="background-color: var(--mk-input); color: var(--mk-text-primary); border: 1px solid var(--mk-border); width: 200px;"
          />

          <select
            class="px-3 py-1.5 text-sm rounded-md outline-none"
            style="background-color: var(--mk-input); color: var(--mk-text-primary); border: 1px solid var(--mk-border);"
          >
            <option>本地服务器</option>
            <option>开发服务器</option>
            <option>生产服务器</option>
          </select>

          <button
            class="flex items-center justify-center w-9 h-9 rounded-md"
            style="background-color: var(--mk-input); color: var(--mk-text-primary); border: 1px solid var(--mk-border);"
            aria-label="切换主题"
          >
            <i data-lucide="sun" class="w-5 h-5"></i>
          </button>

          <button
            class="flex items-center justify-center w-9 h-9 rounded-md"
            style="background-color: var(--mk-input); color: var(--mk-text-primary); border: 1px solid var(--mk-border);"
            aria-label="用户菜单"
          >
            <i data-lucide="user" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="mk-shell__main">
      <div class="servers-toolbar">
        <h1 class="servers-toolbar__title">服务端</h1>
        <div class="servers-toolbar__actions">
          <button class="mk-button mk-button--primary" data-dom-id="btn-add-server">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>添加服务端</span>
          </button>
          <button class="mk-button mk-button--secondary" data-dom-id="btn-refresh-servers">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            <span>刷新</span>
          </button>
        </div>
      </div>

      <div class="servers-layout">
        <div class="servers-list">
          <div class="server-item" data-dom-id="server-item-1" data-active="true">
            <div class="server-item__icon">
              <i data-lucide="server" class="w-5 h-5"></i>
            </div>
            <div class="server-item__meta">
              <div class="server-item__name">本地开发</div>
              <div class="server-item__address">http://localhost:5000</div>
            </div>
            <div class="server-item__badges">
              <span class="status-dot status-dot--online" title="在线"></span>
              <span class="default-badge">默认</span>
            </div>
          </div>

          <div class="server-item" data-dom-id="server-item-2">
            <div class="server-item__icon">
              <i data-lucide="server" class="w-5 h-5"></i>
            </div>
            <div class="server-item__meta">
              <div class="server-item__name">测试环境</div>
              <div class="server-item__address">http://192.168.1.20:8080</div>
            </div>
            <div class="server-item__badges">
              <span class="status-dot status-dot--online" title="在线"></span>
            </div>
          </div>

          <div class="server-item" data-dom-id="server-item-3">
            <div class="server-item__icon">
              <i data-lucide="server" class="w-5 h-5"></i>
            </div>
            <div class="server-item__meta">
              <div class="server-item__name">生产主节点</div>
              <div class="server-item__address">https://api.makara.io</div>
            </div>
            <div class="server-item__badges">
              <span class="status-dot status-dot--online" title="在线"></span>
            </div>
          </div>

          <div class="server-item" data-dom-id="server-item-4">
            <div class="server-item__icon">
              <i data-lucide="server" class="w-5 h-5"></i>
            </div>
            <div class="server-item__meta">
              <div class="server-item__name">备用节点</div>
              <div class="server-item__address">https://backup.makara.io</div>
            </div>
            <div class="server-item__badges">
              <span class="status-dot status-dot--offline" title="离线"></span>
            </div>
          </div>

          <div class="server-item" data-dom-id="server-item-5">
            <div class="server-item__icon">
              <i data-lucide="server" class="w-5 h-5"></i>
            </div>
            <div class="server-item__meta">
              <div class="server-item__name">内部沙箱</div>
              <div class="server-item__address">http://10.0.0.5:9000</div>
            </div>
            <div class="server-item__badges">
              <span class="status-dot status-dot--online" title="在线"></span>
            </div>
          </div>
        </div>

        <div class="servers-detail">
          <div class="form-section">
            <div class="form-section__title">基本信息</div>
            <div class="form-row">
              <label class="mk-label" for="server-name">名称</label>
              <input id="server-name" type="text" class="mk-input" value="本地开发" placeholder="例如：本地开发" />
            </div>
            <div class="form-row">
              <label class="mk-label" for="server-address">地址</label>
              <input id="server-address" type="text" class="mk-input" value="http://localhost:5000" placeholder="http://... 或 https://..." />
            </div>
            <div class="form-row">
              <label class="mk-label" for="server-description">描述</label>
              <input id="server-description" type="text" class="mk-input" value="本地开发调试使用的 Makara 服务" placeholder="可选描述" />
            </div>
            <div class="form-row">
              <label class="mk-switch">
                <input id="server-default" type="checkbox" checked />
                <span class="mk-switch__track"></span>
                <span style="font-size: 14px; color: var(--mk-text-primary);">设为默认服务端</span>
              </label>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section__title">认证信息</div>
            <div class="form-row">
              <label class="mk-label" for="server-token">Token</label>
              <input id="server-token" type="password" class="mk-input" value="mk-********************" placeholder="访问令牌" />
            </div>
          </div>

          <div class="form-actions">
            <button class="mk-button mk-button--secondary" data-dom-id="btn-set-default">
              <i data-lucide="star" class="w-4 h-4"></i>
              <span>设为默认</span>
            </button>
            <button class="mk-button mk-button--primary" data-dom-id="btn-save-server">
              <i data-lucide="save" class="w-4 h-4"></i>
              <span>保存</span>
            </button>
            <button class="mk-button mk-button--danger" data-dom-id="btn-delete-server">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              <span>删除</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer class="servers-footer">
    <div class="connection-status">
      <span class="status-dot status-dot--online"></span>
      <span>已连接：本地开发</span>
    </div>
    <div class="connection-status__latency">延迟 24ms</div>
  </footer>

  <script>lucide.createIcons();</script>

    <style id="page-servers">
      .mk-shell {
        display: flex;
        min-height: 100vh;
        font-family: var(--mk-font-sans);
      }

      .mk-shell__sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 100vh;
        background-color: var(--mk-surface);
        border-right: 1px solid var(--mk-border);
        display: flex;
        flex-direction: column;
      }

      .mk-shell__header {
        position: fixed;
        top: 0;
        left: 200px;
        right: 0;
        height: 56px;
        background-color: var(--mk-surface);
        border-bottom: 1px solid var(--mk-border);
      }

      .mk-shell__main {
        margin-left: 200px;
        margin-top: 56px;
        padding: 24px;
        min-height: calc(100vh - 56px);
        background-color: var(--mk-background);
        color: var(--mk-text-primary);
      }

      .mk-shell__nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 0 12px;
      }

      .mk-shell__nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        border-radius: var(--mk-radius-md);
        color: var(--mk-text-secondary);
        background: transparent;
        border: none;
        font-size: 14px;
        line-height: 20px;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .mk-shell__nav-item:hover {
        background-color: var(--mk-surface-2);
        color: var(--mk-text-primary);
      }

      .mk-shell__nav-item[data-active="true"] {
        background-color: var(--mk-primary);
        color: var(--mk-primary-foreground);
      }

      .servers-layout {
        display: flex;
        gap: 24px;
        min-height: calc(100vh - 56px - 48px - 80px);
      }

      .servers-list {
        width: 320px;
        flex-shrink: 0;
        background-color: var(--mk-card);
        border: 1px solid var(--mk-border);
        border-radius: var(--mk-radius-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .servers-detail {
        flex: 1 1 auto;
        background-color: var(--mk-card);
        border: 1px solid var(--mk-border);
        border-radius: var(--mk-radius-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .server-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--mk-border);
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .server-item:hover {
        background-color: var(--mk-surface-2);
      }

      .server-item[data-active="true"] {
        background-color: var(--mk-surface-2);
        border-left: 3px solid var(--mk-primary);
      }

      .server-item__icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: var(--mk-radius-md);
        background-color: var(--mk-surface-2);
        color: var(--mk-primary);
        flex-shrink: 0;
      }

      .server-item__meta {
        flex: 1 1 auto;
        min-width: 0;
      }

      .server-item__name {
        font-size: 14px;
        font-weight: 500;
        color: var(--mk-text-primary);
        line-height: 20px;
      }

      .server-item__address {
        font-size: 12px;
        color: var(--mk-text-secondary);
        line-height: 18px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .server-item__badges {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        flex-shrink: 0;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: var(--mk-radius-full);
      }

      .status-dot--online {
        background-color: var(--mk-state-success);
        box-shadow: 0 0 6px var(--mk-state-success);
      }

      .status-dot--offline {
        background-color: var(--mk-state-error);
      }

      .default-badge {
        font-size: 10px;
        font-weight: 500;
        line-height: 16px;
        padding: 2px 8px;
        border-radius: var(--mk-radius-full);
        background-color: var(--mk-primary-900);
        color: var(--mk-primary-300);
      }

      .servers-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .servers-toolbar__title {
        font-size: 20px;
        font-weight: 600;
        color: var(--mk-text-primary);
      }

      .servers-toolbar__actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mk-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: var(--mk-radius-md);
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: opacity 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
      }

      .mk-button:hover {
        opacity: 0.9;
      }

      .mk-button--primary {
        background-color: var(--mk-primary);
        color: var(--mk-primary-foreground);
      }

      .mk-button--secondary {
        background-color: var(--mk-surface-2);
        color: var(--mk-text-primary);
        border-color: var(--mk-border);
      }

      .mk-button--ghost {
        background-color: transparent;
        color: var(--mk-text-secondary);
        border-color: var(--mk-border);
      }

      .mk-button--danger {
        background-color: transparent;
        color: var(--mk-state-error);
        border-color: var(--mk-state-error);
      }

      .mk-input {
        width: 100%;
        padding: 10px 12px;
        border-radius: var(--mk-radius-md);
        background-color: var(--mk-input);
        color: var(--mk-text-primary);
        border: 1px solid var(--mk-border);
        font-size: 14px;
        line-height: 20px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .mk-input:focus {
        border-color: var(--mk-primary);
        box-shadow: 0 0 0 3px var(--mk-ring);
      }

      .mk-input::placeholder {
        color: var(--mk-text-tertiary);
      }

      .mk-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--mk-text-secondary);
        margin-bottom: 6px;
      }

      .mk-switch {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }

      .mk-switch__track {
        width: 40px;
        height: 22px;
        border-radius: var(--mk-radius-full);
        background-color: var(--mk-surface-3);
        position: relative;
        transition: background-color 0.15s ease;
      }

      .mk-switch__track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: var(--mk-radius-full);
        background-color: var(--mk-text-primary);
        transition: transform 0.15s ease;
      }

      .mk-switch input:checked + .mk-switch__track {
        background-color: var(--mk-primary);
      }

      .mk-switch input:checked + .mk-switch__track::after {
        transform: translateX(18px);
        background-color: var(--mk-primary-foreground);
      }

      .mk-switch input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      .servers-footer {
        position: fixed;
        left: 200px;
        right: 0;
        bottom: 0;
        height: 44px;
        background-color: var(--mk-surface);
        border-top: 1px solid var(--mk-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        font-size: 13px;
        color: var(--mk-text-secondary);
      }

      .connection-status {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .connection-status__latency {
        font-family: var(--mk-font-mono);
        color: var(--mk-primary);
      }

      .form-section {
        padding: 24px;
        border-bottom: 1px solid var(--mk-border);
      }

      .form-section:last-child {
        border-bottom: none;
      }

      .form-section__title {
        font-size: 14px;
        font-weight: 600;
        color: var(--mk-text-primary);
        margin-bottom: 16px;
      }

      .form-row {
        margin-bottom: 16px;
      }

      .form-row:last-child {
        margin-bottom: 0;
      }

      .form-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 24px;
        margin-top: auto;
        border-top: 1px solid var(--mk-border);
        background-color: var(--mk-card);
      }
    </style>
</body>
</html>
